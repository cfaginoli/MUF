<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUF — Catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#EDEAE6;--dark:#3D3D3D;--copper:#C49A7A;--copper2:#A87D5E;--white:#FAFAF8;--border:#D8D4CE;--light-text:#888;
}
body{font-family:'Lato',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;max-width:480px;margin:0 auto}
.header{background:var(--white);border-bottom:1px solid var(--border);padding:1.75rem 1.5rem 1.5rem;display:flex;flex-direction:column;align-items:center;gap:.35rem}
.logo-wrap{display:flex;align-items:center;gap:0}
.logo-text{font-family:'Montserrat',sans-serif;font-size:40px;font-weight:800;letter-spacing:7px;color:var(--dark);line-height:1}
.logo-u{position:relative;display:inline-block}
.logo-u::after{content:'';display:block;position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:55%;height:3.5px;background:var(--copper);border-radius:1px}
.tagline{font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--light-text);font-weight:400;margin-top:.75rem}
.nav{display:flex;background:var(--white);border-bottom:2px solid var(--border);position:sticky;top:0;z-index:100}
.nav-btn{flex:1;padding:.85rem .5rem;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;border:none;background:transparent;cursor:pointer;color:var(--light-text);transition:.2s;border-bottom:2px solid transparent;margin-bottom:-2px}
.nav-btn.active{color:var(--dark);border-bottom-color:var(--copper)}
.section{display:none;padding:1.25rem}
.section.active{display:block}
.products-grid{display:flex;flex-direction:column;gap:1rem}
.product-card{background:var(--white);border:1px solid var(--border);border-radius:4px;overflow:hidden}

/* CARRUSEL */
.carousel{position:relative;width:100%;aspect-ratio:1/1;background:var(--bg);overflow:hidden}
.carousel-track{display:flex;height:100%;transition:transform .3s ease}
.carousel-slide{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.carousel-slide img{width:100%;height:100%;object-fit:cover}
.carousel-slide .no-photo{font-size:64px;opacity:.35}
.carousel-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.85);border:none;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--dark);z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.carousel-arrow.left{left:8px}
.carousel-arrow.right{right:8px}
.carousel-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.carousel-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);transition:.2s;cursor:pointer}
.carousel-dot.active{background:var(--white)}

.product-info-row{padding:1rem 1.1rem .6rem}
.product-name{font-family:'Montserrat',sans-serif;font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;color:var(--dark)}
.product-desc{font-size:12px;color:var(--light-text);letter-spacing:.3px}
.product-price{font-family:'Montserrat',sans-serif;font-size:17px;font-weight:700;color:var(--copper2);margin-top:5px}
.talles-section{border-top:1px solid var(--border);padding:.875rem 1.1rem;background:var(--bg)}
.talles-label{font-family:'Montserrat',sans-serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--light-text);margin-bottom:.5rem;font-weight:700}
.talles-row{display:flex;gap:.5rem}
.talle-btn{padding:.4rem 1rem;border:1px solid var(--border);border-radius:2px;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:700;background:var(--white);cursor:pointer;transition:.15s;color:var(--dark);letter-spacing:.5px}
.talle-btn:active{border-color:var(--copper);color:var(--copper2)}
.talle-btn.selected{background:var(--dark);color:var(--white);border-color:var(--dark)}
.talle-btn.sin-stock{opacity:.3;cursor:not-allowed;text-decoration:line-through}
.add-row{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.1rem;border-top:1px solid var(--border)}
.qty-ctrl{display:flex;align-items:center;gap:.6rem}
.qty-btn{width:32px;height:32px;border:1px solid var(--border);border-radius:2px;background:var(--white);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:var(--dark);transition:.15s;font-weight:300}
.qty-btn:active{border-color:var(--copper);color:var(--copper2)}
.qty-num{font-family:'Montserrat',sans-serif;font-size:14px;font-weight:700;min-width:24px;text-align:center}
.add-btn{background:var(--dark);color:var(--white);border:none;border-radius:2px;padding:.55rem 1.4rem;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:.2s}
.add-btn:active{background:var(--copper2);transform:scale(.97)}
.add-btn.ok{background:var(--copper2)}
.carrito-section{background:var(--white);border:1px solid var(--border);border-radius:4px;padding:1.1rem}
.empty-cart{text-align:center;padding:2.5rem;color:#bbb;font-family:'Montserrat',sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--border)}
.cart-item:last-child{border-bottom:none}
.cart-item-name{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.cart-item-sub{font-size:11px;color:var(--light-text);margin-top:2px;letter-spacing:.3px}
.cart-item-price{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:700;color:var(--copper2);margin:0 .75rem;white-space:nowrap}
.del-btn{width:26px;height:26px;border:none;background:none;cursor:pointer;color:#ccc;font-size:15px;display:flex;align-items:center;justify-content:center;border-radius:2px;flex-shrink:0}
.del-btn:active{background:#FEE;color:#E24B4A}
.total-row{display:flex;justify-content:space-between;align-items:center;padding:.9rem 0 0;margin-top:.25rem;border-top:2px solid var(--dark)}
.total-label{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase}
.total-price{font-family:'Montserrat',sans-serif;font-size:22px;font-weight:800;color:var(--copper2)}
.ws-btn{display:block;width:100%;margin-top:1rem;background:#25D366;color:#fff;border:none;border-radius:3px;padding:.9rem;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer}
.ws-btn:active{background:#1EB85A;transform:scale(.98)}
.admin-section{display:flex;flex-direction:column;gap:1rem}
.form-card{background:var(--white);border:1px solid var(--border);border-radius:4px;padding:1.25rem}
.form-title{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;margin-bottom:1rem;color:var(--dark)}
.field{margin-bottom:.75rem}
.field label{display:block;font-family:'Montserrat',sans-serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--light-text);margin-bottom:.35rem;font-weight:700}
.field input,.field select,.field textarea{width:100%;padding:.55rem .75rem;border:1px solid var(--border);border-radius:2px;font-family:'Lato',sans-serif;font-size:14px;color:var(--dark);background:var(--white);outline:none;-webkit-appearance:none}
.field input:focus,.field select:focus{border-color:var(--copper)}
.field textarea{resize:vertical;min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.save-btn{width:100%;background:var(--dark);color:var(--white);border:none;border-radius:2px;padding:.75rem;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-top:.25rem}
.save-btn:active{background:var(--copper2)}
.stock-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.25rem}
.stock-item{text-align:center}
.stock-item label{font-family:'Montserrat',sans-serif;font-size:10px;color:var(--light-text);display:block;margin-bottom:.3rem;letter-spacing:1px;font-weight:700}
.stock-item input{width:100%;padding:.45rem;border:1px solid var(--border);border-radius:2px;font-size:14px;text-align:center;color:var(--dark)}
.msg{font-family:'Montserrat',sans-serif;font-size:10px;color:var(--copper2);margin-top:.6rem;text-align:center;min-height:16px;letter-spacing:1px;text-transform:uppercase}
.product-list-admin{display:flex;flex-direction:column;gap:.5rem}
.prod-row{display:flex;align-items:center;justify-content:space-between;padding:.65rem .875rem;background:var(--bg);border-radius:2px;border:1px solid var(--border)}
.prod-row-name{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.prod-row-sub{font-size:11px;color:var(--light-text);margin-top:2px}
.edit-del{display:flex;gap:.4rem;flex-shrink:0}
.icon-btn{width:30px;height:30px;border:1px solid var(--border);border-radius:2px;background:var(--white);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--dark)}
.section-label{font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--light-text);margin-bottom:.875rem;font-weight:700}
.no-products{text-align:center;padding:.75rem;font-size:12px;color:#bbb;font-family:'Montserrat',sans-serif;letter-spacing:.5px}

/* FOTOS EN ADMIN */
.fotos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.25rem}
.foto-slot{position:relative;aspect-ratio:1/1;border:1.5px dashed var(--border);border-radius:3px;overflow:hidden;cursor:pointer;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.foto-slot:hover{border-color:var(--copper)}
.foto-slot img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
.foto-slot .slot-label{font-family:'Montserrat',sans-serif;font-size:9px;letter-spacing:1px;color:var(--light-text);text-transform:uppercase;z-index:1}
.foto-slot .slot-icon{font-size:20px;z-index:1;opacity:.5}
.foto-slot .remove-foto{position:absolute;top:3px;right:3px;width:20px;height:20px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.foto-slot input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:3}
</style>
</head>
<body>

<div class="header">
  <div class="logo-wrap">
    <span class="logo-text">M<span class="logo-u">U</span>F</span>
  </div>
  <div class="tagline">Catálogo — Colección temporada</div>
</div>

<div class="nav">
  <button class="nav-btn active" onclick="showTab(this,'catalogo')">Catálogo</button>
  <button class="nav-btn" onclick="showTab(this,'carrito')">Carrito <span id="cart-badge"></span></button>
  <button class="nav-btn" onclick="pedirClave(this)">Gestión</button>
</div>

<div id="tab-catalogo" class="section active">
  <div class="products-grid" id="products-grid"></div>
</div>

<div id="tab-carrito" class="section">
  <p class="section-label">Mi pedido</p>
  <div class="carrito-section">
    <div id="cart-content"></div>
  </div>
  <button class="ws-btn" onclick="enviarWS()">📲 Enviar pedido por WhatsApp</button>
</div>

<div id="tab-admin" class="section">
  <div class="admin-section">
    <div class="form-card">
      <p class="form-title" id="form-title">Agregar producto</p>
      <div class="field"><label>Nombre del producto</label><input type="text" id="f-nombre" placeholder="Ej: Calza deportiva"></div>
      <div class="row2">
        <div class="field"><label>Categoría</label>
          <select id="f-cat">
            <option value="calzas">Calzas</option>
            <option value="conjuntos">Conjuntos</option>
            <option value="otro">Otro</option>
          </select>
        </div>
        <div class="field"><label>Precio ($)</label><input type="number" id="f-precio" placeholder="0"></div>
      </div>
      <div class="field"><label>Descripción</label><textarea id="f-desc" placeholder="Material, estilo, etc."></textarea></div>
      <div class="field"><label>Fotos del producto (hasta 3)</label>
        <div class="fotos-grid">
          <div class="foto-slot" id="slot-0">
            <span class="slot-icon">📷</span>
            <span class="slot-label">Foto 1</span>
            <input type="file" accept="image/*" onchange="cargarFoto(0,this)">
          </div>
          <div class="foto-slot" id="slot-1">
            <span class="slot-icon">📷</span>
            <span class="slot-label">Foto 2</span>
            <input type="file" accept="image/*" onchange="cargarFoto(1,this)">
          </div>
          <div class="foto-slot" id="slot-2">
            <span class="slot-icon">📷</span>
            <span class="slot-label">Foto 3</span>
            <input type="file" accept="image/*" onchange="cargarFoto(2,this)">
          </div>
        </div>
      </div>
      <div class="field"><label>Stock por talle</label>
        <div class="stock-grid">
          <div class="stock-item"><label>S</label><input type="number" id="s-S" value="10" min="0"></div>
          <div class="stock-item"><label>M</label><input type="number" id="s-M" value="10" min="0"></div>
          <div class="stock-item"><label>L</label><input type="number" id="s-L" value="10" min="0"></div>
        </div>
      </div>
      <input type="hidden" id="edit-id" value="">
      <button class="save-btn" onclick="guardarProducto()">Guardar producto</button>
      <p class="msg" id="form-msg"></p>
    </div>
    <div class="form-card">
      <p class="form-title">Productos activos</p>
      <div class="product-list-admin" id="admin-list"></div>
    </div>
  </div>
</div>

<script>
const LOCAL_WS='5493517479242';
const EMOJIS={calzas:'🩱',conjuntos:'👗',otro:'👕'};

let tempFotos=[null,null,null];

let products=[
  {id:1,nombre:'Calza deportiva',cat:'calzas',precio:8500,desc:'Lycra premium, cintura alta',fotos:[],stock:{S:5,M:8,L:3}},
  {id:2,nombre:'Conjunto deportivo',cat:'conjuntos',precio:18000,desc:'Top + calza a juego',fotos:[],stock:{S:6,M:4,L:7}}
];

let cart=[];
let nextId=Math.max(...products.map(p=>p.id),0)+1;

function showTab(btn,t){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  btn.classList.add('active');
  if(t==='catalogo')renderCatalog();
  if(t==='carrito')renderCart();
  if(t==='admin')renderAdmin();
}

function pedirClave(btn){
  const clave=prompt('Ingresá la clave de Gestión:');
  if(clave==='martina123'){showTab(btn,'admin')}
  else if(clave!==null){alert('Clave incorrecta')}
}

/* ---- FOTOS ---- */
function cargarFoto(idx,input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    tempFotos[idx]=e.target.result;
    renderSlot(idx,e.target.result);
  };
  reader.readAsDataURL(file);
}

function renderSlot(idx,src){
  const slot=document.getElementById('slot-'+idx);
  const inp=slot.querySelector('input');
  slot.innerHTML='';
  if(src){
    const img=document.createElement('img');
    img.src=src;
    slot.appendChild(img);
    const btn=document.createElement('button');
    btn.className='remove-foto';
    btn.textContent='✕';
    btn.onclick=(e)=>{e.stopPropagation();quitarFoto(idx)};
    slot.appendChild(btn);
  } else {
    slot.innerHTML=`<span class="slot-icon">📷</span><span class="slot-label">Foto ${idx+1}</span>`;
  }
  slot.appendChild(inp);
}

function quitarFoto(idx){
  tempFotos[idx]=null;
  renderSlot(idx,null);
}

function resetFotos(){
  tempFotos=[null,null,null];
  [0,1,2].forEach(i=>renderSlot(i,null));
}

function cargarFotosEnForm(fotos){
  tempFotos=[fotos[0]||null,fotos[1]||null,fotos[2]||null];
  [0,1,2].forEach(i=>renderSlot(i,tempFotos[i]));
}

/* ---- CATÁLOGO ---- */
function renderCatalog(){
  const grid=document.getElementById('products-grid');
  grid.innerHTML='';
  if(!products.length){
    grid.innerHTML='<p style="text-align:center;color:#bbb;padding:2rem;font-size:12px;font-family:Montserrat,sans-serif;letter-spacing:1px;text-transform:uppercase">Sin productos cargados</p>';
    return;
  }
  products.forEach(p=>{
    const card=document.createElement('div');
    card.className='product-card';
    card.id='card-'+p.id;
    const fotos=(p.fotos||[]).filter(Boolean);
    const hasPhotos=fotos.length>0;

    let slidesHTML='';
    if(hasPhotos){
      fotos.forEach(f=>{slidesHTML+=`<div class="carousel-slide"><img src="${f}" alt="foto"></div>`;});
    } else {
      slidesHTML=`<div class="carousel-slide"><span class="no-photo">${EMOJIS[p.cat]||'👕'}</span></div>`;
    }

    const dotsHTML=hasPhotos&&fotos.length>1
      ?fotos.map((_,i)=>`<span class="carousel-dot${i===0?' active':''}" onclick="goSlide(${p.id},${i})"></span>`).join(''):'';
    const arrowsHTML=hasPhotos&&fotos.length>1
      ?`<button class="carousel-arrow left" onclick="moveSlide(${p.id},-1)">&#8249;</button><button class="carousel-arrow right" onclick="moveSlide(${p.id},1)">&#8250;</button>`:'';

    const tallesHTML=Object.entries(p.stock).map(([t,s])=>`
      <button class="talle-btn${s===0?' sin-stock':''}" onclick="${s>0?`selTalle(this,${p.id},'${t}')`:'void(0)'}">
        ${t}${s===0?' ✕':''}
      </button>`).join('');

    card.innerHTML=`
      <div class="carousel" id="carousel-${p.id}">
        <div class="carousel-track" id="track-${p.id}">${slidesHTML}</div>
        ${arrowsHTML}
        ${dotsHTML?`<div class="carousel-dots">${dotsHTML}</div>`:''}
      </div>
      <div class="product-info-row">
        <div class="product-name">${p.nombre}</div>
        <div class="product-desc">${p.desc}</div>
        <div class="product-price">$${Number(p.precio).toLocaleString('es-AR')}</div>
      </div>
      <div class="talles-section">
        <div class="talles-label">Seleccioná tu talle</div>
        <div class="talles-row" id="talles-${p.id}">${tallesHTML}</div>
      </div>
      <div class="add-row">
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeQty(${p.id},-1)">−</button>
          <span class="qty-num" id="qty-${p.id}">1</span>
          <button class="qty-btn" onclick="changeQty(${p.id},1)">+</button>
        </div>
        <button class="add-btn" id="addbtn-${p.id}" onclick="addToCart(${p.id})">Agregar +</button>
      </div>`;
    grid.appendChild(card);
  });
}

/* ---- CARRUSEL CONTROLS ---- */
const slideIdx={};
function moveSlide(pid,dir){
  const p=products.find(x=>x.id===pid);
  const total=(p.fotos||[]).filter(Boolean).length;
  if(!total)return;
  slideIdx[pid]=((slideIdx[pid]||0)+dir+total)%total;
  applySlide(pid,total);
}
function goSlide(pid,i){
  slideIdx[pid]=i;
  const p=products.find(x=>x.id===pid);
  applySlide(pid,(p.fotos||[]).filter(Boolean).length);
}
function applySlide(pid){
  const idx=slideIdx[pid]||0;
  const track=document.getElementById('track-'+pid);
  if(track)track.style.transform=`translateX(-${idx*100}%)`;
  document.querySelectorAll(`#carousel-${pid} .carousel-dot`).forEach((d,i)=>d.classList.toggle('active',i===idx));
}

/* ---- TALLE / QTY / CART ---- */
function selTalle(btn,pid,t){
  document.querySelectorAll('#talles-'+pid+' .talle-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('card-'+pid).dataset.talle=t;
}

function changeQty(pid,d){
  const el=document.getElementById('qty-'+pid);
  let v=parseInt(el.textContent)+d;
  if(v<1)v=1;
  el.textContent=v;
}

function addToCart(pid){
  const card=document.getElementById('card-'+pid);
  const talle=card.dataset.talle;
  if(!talle){alert('Seleccioná un talle primero');return}
  const qty=parseInt(document.getElementById('qty-'+pid).textContent);
  const p=products.find(x=>x.id===pid);
  const existing=cart.find(c=>c.pid===pid&&c.talle===talle);
  if(existing){existing.qty+=qty}
  else{cart.push({pid,talle,qty,nombre:p.nombre,precio:p.precio})}
  updateBadge();
  document.querySelectorAll('#talles-'+pid+' .talle-btn').forEach(b=>b.classList.remove('selected'));
  delete card.dataset.talle;
  document.getElementById('qty-'+pid).textContent='1';
  const btn=document.getElementById('addbtn-'+pid);
  btn.textContent='✓ Agregado';btn.classList.add('ok');
  setTimeout(()=>{btn.textContent='Agregar +';btn.classList.remove('ok')},1200);
}

function updateBadge(){
  const n=cart.reduce((a,c)=>a+c.qty,0);
  document.getElementById('cart-badge').textContent=n?'('+n+')':'';
}

function renderCart(){
  const div=document.getElementById('cart-content');
  if(!cart.length){div.innerHTML='<div class="empty-cart">Tu carrito está vacío</div>';return}
  const total=cart.reduce((a,c)=>a+c.precio*c.qty,0);
  div.innerHTML=cart.map((c,i)=>`
    <div class="cart-item">
      <div style="flex:1">
        <div class="cart-item-name">${c.nombre}</div>
        <div class="cart-item-sub">Talle ${c.talle} · Cantidad: ${c.qty}</div>
      </div>
      <div class="cart-item-price">$${(c.precio*c.qty).toLocaleString('es-AR')}</div>
      <button class="del-btn" onclick="removeItem(${i})">✕</button>
    </div>`).join('')+`
    <div class="total-row">
      <span class="total-label">Total</span>
      <span class="total-price">$${total.toLocaleString('es-AR')}</span>
    </div>`;
}

function removeItem(i){cart.splice(i,1);updateBadge();renderCart()}

function enviarWS(){
  if(!cart.length){alert('El carrito está vacío');return}
  const total=cart.reduce((a,c)=>a+c.precio*c.qty,0);
  let msg='👗 *Hola MUF! Quiero hacer un pedido:*\n\n';
  cart.forEach(c=>{
    msg+='• '+c.nombre.toUpperCase()+' — Talle '+c.talle+' x'+c.qty+' = $'+(c.precio*c.qty).toLocaleString('es-AR')+'\n';
  });
  msg+='\n*Total: $'+total.toLocaleString('es-AR')+'*\n\n¿Tienen disponibilidad?';
  window.open('https://wa.me/'+LOCAL_WS+'?text='+encodeURIComponent(msg),'_blank');
}

/* ---- ADMIN ---- */
function renderAdmin(){
  const list=document.getElementById('admin-list');
  if(!products.length){list.innerHTML='<p class="no-products">Sin productos</p>';return}
  list.innerHTML=products.map(p=>`
    <div class="prod-row">
      <div style="flex:1;min-width:0">
        <div class="prod-row-name">${p.nombre}</div>
        <div class="prod-row-sub">${p.cat} · $${Number(p.precio).toLocaleString('es-AR')} · S:${p.stock.S} M:${p.stock.M} L:${p.stock.L} · 📷${(p.fotos||[]).filter(Boolean).length}</div>
      </div>
      <div class="edit-del">
        <button class="icon-btn" onclick="editProduct(${p.id})">✎</button>
        <button class="icon-btn" onclick="deleteProduct(${p.id})" style="color:#E24B4A">✕</button>
      </div>
    </div>`).join('');
}

function editProduct(id){
  const p=products.find(x=>x.id===id);
  document.getElementById('f-nombre').value=p.nombre;
  document.getElementById('f-cat').value=p.cat;
  document.getElementById('f-precio').value=p.precio;
  document.getElementById('f-desc').value=p.desc;
  document.getElementById('s-S').value=p.stock.S;
  document.getElementById('s-M').value=p.stock.M;
  document.getElementById('s-L').value=p.stock.L;
  document.getElementById('edit-id').value=id;
  document.getElementById('form-title').textContent='Editar producto';
  document.getElementById('form-msg').textContent='';
  cargarFotosEnForm(p.fotos||[]);
  window.scrollTo(0,0);
}

function deleteProduct(id){
  if(!confirm('¿Eliminar este producto?'))return;
  products=products.filter(x=>x.id!==id);renderAdmin();
}

function guardarProducto(){
  const nombre=document.getElementById('f-nombre').value.trim();
  const cat=document.getElementById('f-cat').value;
  const precio=parseFloat(document.getElementById('f-precio').value);
  const desc=document.getElementById('f-desc').value.trim();
  const S=parseInt(document.getElementById('s-S').value)||0;
  const M=parseInt(document.getElementById('s-M').value)||0;
  const L=parseInt(document.getElementById('s-L').value)||0;
  const fotos=tempFotos.slice();
  if(!nombre||!precio){document.getElementById('form-msg').textContent='Completá nombre y precio';return}
  const eid=document.getElementById('edit-id').value;
  if(eid){
    const idx=products.findIndex(x=>x.id===parseInt(eid));
    products[idx]={...products[idx],nombre,cat,precio,desc,fotos,stock:{S,M,L}};
    document.getElementById('edit-id').value='';
    document.getElementById('form-title').textContent='Agregar producto';
    document.getElementById('form-msg').textContent='Producto actualizado ✓';
  } else {
    products.push({id:nextId++,nombre,cat,precio,desc,fotos,stock:{S,M,L}});
    document.getElementById('form-msg').textContent='Producto agregado ✓';
  }
  document.getElementById('f-nombre').value='';
  document.getElementById('f-precio').value='';
  document.getElementById('f-desc').value='';
  document.getElementById('s-S').value=10;
  document.getElementById('s-M').value=10;
  document.getElementById('s-L').value=10;
  resetFotos();
  renderAdmin();
  setTimeout(()=>document.getElementById('form-msg').textContent='',3000);
}

renderCatalog();
renderAdmin();
</script>
</body>
</html>
